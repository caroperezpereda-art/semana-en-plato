
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Semana en Plato</title>
<!-- PWA Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  --bg: #15150F;
  --card: #1E1E16;
  --card2: #262619;
  --line: #34342A;
  --text: #F3F1E7;
  --text-soft: #ABA895;
  --butter: #F3CE68;
  --mint: #A9D8A0;
  --sky: #8FB8D9;
  --coral: #E38B7C;
  --lilac: #C9A6E0;
  --green-ok: #A9D8A0;
  --amber-warn: #F3CE68;
  --red-over: #E38B7C;
  --safe-top: env(safe-area-inset-top);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: 'Work Sans', sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  line-height: 1.45;
  padding-top: var(--safe-top);
}
.wrap { max-width: 720px; margin: 0 auto; padding: 22px 18px 90px; }

h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; color: var(--text); }
.eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--mint); margin: 0 0 8px; }
.headline { font-size: 30px; font-style: italic; font-weight: 500; color: var(--butter); }
.headline b { font-style: normal; font-weight: 600; color: var(--text); }
.sub { color: var(--text-soft); font-size: 13.5px; margin-top: 6px; max-width: 560px; }

/* Welcome / login screen */
#welcome-screen {
  position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; justify-content: center;
  background-image: linear-gradient(180deg, rgba(10,10,7,0.35) 0%, rgba(10,10,7,0.55) 40%, rgba(10,10,7,0.95) 88%), url('https://images.unsplash.com/photo-1547592166-23ac45744acd?q=80&w=2071&auto=format&fit=crop');
  background-size: cover; background-position: center;
}
#welcome-screen .wcard { width: 100%; max-width: 480px; padding: 28px 26px 40px; border-radius: 24px 24px 0 0; background: var(--bg); border-top: 1px solid var(--line); }
#welcome-screen .wlogo { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 42px; color: var(--butter); line-height: 1.05; text-align: center; margin-bottom: 6px; letter-spacing: -0.01em; }
#welcome-screen .wtag { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--mint); margin-bottom: 34px; }
#welcome-screen label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-soft); display: block; margin: 14px 0 6px; }

/* Global UI Elements */
input[type=text], input[type=number], select, textarea {
  width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card2); color: var(--text); font-family: 'Work Sans'; font-size: 14.5px;
}
.btn { font-family: 'Work Sans', sans-serif; font-weight: 700; border-radius: 12px; padding: 14px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
.btn-primary { background: var(--butter); color: #14140D; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }

#app-root { display: none; }
#app-root.ready { display: block; }

.tabs { display: flex; gap: 4px; margin: 22px 0 20px; overflow-x: auto; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 50; padding-top: 10px; }
.tab-btn { font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 13px; background: none; border: none; padding: 12px 6px; margin-right: 14px; color: var(--text-soft); cursor: pointer; white-space: nowrap; }
.tab-btn.active { color: var(--butter); box-shadow: 0 2px 0 var(--butter); }

.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; }
.rcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; }
.rcard .photo { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--card2); }
.rcard .body { padding: 12px; }
.rcard .name { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; margin-bottom: 4px; line-height: 1.2; }
.rcard .cal { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--mint); }

.day-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
.day-tab { min-width: 60px; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); text-align: center; cursor: pointer; }
.day-tab.active { background: var(--butter); color: #14140D; font-weight: 700; border-color: var(--butter); }

.meal-row { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
.meal-row .label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--text-soft); margin-bottom: 10px; display: flex; justify-content: space-between; }
.meal-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.meal-item:first-child { border-top: none; }

/* Modals & Overlays */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; padding: 20px; overflow-y: auto; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: var(--card); border-radius: 24px; width: 100%; max-width: 500px; padding: 24px; border: 1px solid var(--line); }

.search-bar { margin-bottom: 16px; position: relative; }
.search-bar input { padding-left: 36px; border-radius: 999px; background: var(--card); }

.copy-day-btn { font-size: 10px; color: var(--mint); text-decoration: underline; cursor: pointer; }

/* Colors for meal dots */
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.dot-desayuno { background: var(--butter); }
.dot-comida { background: var(--mint); }
.dot-cena { background: var(--sky); }
.dot-colacion { background: var(--coral); }

@media (min-width: 880px) {
  .wrap { max-width: 1000px; }
  .recipe-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<!-- Pantalla de Inicio -->
<div id="welcome-screen">
  <div class="wcard">
    <div class="wlogo">Semana en Plato</div>
    <div class="wtag">tu semana, tu plato</div>
    <label>Tu nombre</label>
    <input type="text" id="wName" placeholder="Ej. Carolina">
    <button class="btn btn-primary" id="btnEnter" style="width:100%; margin-top:20px;">Entrar</button>
    <div id="codeArea" style="margin-top:20px; text-align:center;">
        <span style="font-size:12px; color:var(--text-soft); text-decoration:underline; cursor:pointer;" id="toggleImport">Importar recetas de invitación</span>
        <input type="file" id="welcomeFileInput" style="display:none;" accept=".json">
    </div>
  </div>
</div>

<!-- Estructura de la App -->
<div id="app-root">
  <div class="wrap">
    <header style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px;">
        <div>
            <p class="eyebrow">Bienvenida, <span id="userNameDisplay"></span></p>
            <h1 class="headline">Semana en <b>Plato</b></h1>
        </div>
        <button id="btnSettings" class="btn-ghost" style="border:none; background:none; cursor:pointer; padding:10px;">⚙️</button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="recetas">Recetas</button>
      <button class="tab-btn" data-tab="plan">Plan Semanal</button>
      <button class="tab-btn" data-tab="super">Mi Súper</button>
      <button class="tab-btn" data-tab="scan">Scan Menú</button>
    </div>

    <!-- Pestaña Recetas -->
    <div class="panel active" id="panel-recetas">
      <div class="search-bar">
          <input type="text" id="recipeSearch" placeholder="Buscar receta...">
      </div>
      <div id="chipFilters" class="day-tabs" style="overflow-x:auto; margin-bottom:15px;"></div>
      <button class="btn btn-primary" id="btnNewRecipe" style="width:100%; margin-bottom:20px;">+ Nueva Receta</button>
      <div id="recipeGrid" class="recipe-grid"></div>
    </div>

    <!-- Pestaña Plan -->
    <div class="panel" id="panel-plan">
      <div id="dayTabs" class="day-tabs"></div>
      <div id="dayContent">
          <div class="meal-row" id="plan-desayuno"></div>
          <div class="meal-row" id="plan-comida"></div>
          <div class="meal-row" id="plan-cena"></div>
          <div class="meal-row" id="plan-colacion"></div>
      </div>
      <div id="weeklySummary" style="margin-top:30px;"></div>
    </div>

    <!-- Pestaña Súper -->
    <div class="panel" id="panel-super">
      <div id="superList"></div>
    </div>

    <!-- Pestaña Scan -->
    <div class="panel" id="panel-scan">
        <div class="meal-row" style="text-align:center;">
            <h3 style="margin-bottom:10px;">Analiza un Menú</h3>
            <p class="sub">Toma una foto al menú del restaurante y te diré qué opción se ajusta a tu plan.</p>
            <button class="btn btn-primary" id="btnTriggerScan" style="width:100%; margin-top:20px;">Subir Foto del Menú</button>
            <input type="file" id="scanInput" style="display:none;" accept="image/*" capture="environment">
            <div id="scanStatus" style="margin-top:15px; font-size:12px;"></div>
            <div id="scanResults" style="margin-top:20px; text-align:left;"></div>
        </div>
    </div>
  </div>
</div>

<!-- Modal Receta -->
<div class="overlay" id="recipeModal">
    <div class="modal">
        <h3 id="modalTitle">Nueva Receta</h3>
        <label>Nombre</label>
        <input type="text" id="rformName">
        <label>Calorías</label>
        <input type="number" id="rformCal">
        <label>Categoría</label>
        <select id="rformType">
            <option value="desayuno">Desayuno</option>
            <option value="comida">Comida</option>
            <option value="cena">Cena</option>
            <option value="colacion">Colación</option>
        </select>
        <label>Ingredientes (uno por línea)</label>
        <textarea id="rformIng"></textarea>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn btn-ghost" id="btnCancelRecipe" style="flex:1">Cancelar</button>
            <button class="btn btn-primary" id="btnSaveRecipe" style="flex:2">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal Ajustes -->
<div class="overlay" id="settingsModal">
    <div class="modal">
        <h3>Ajustes</h3>
        <label>Rango Calórico Diario</label>
        <div style="display:flex; gap:10px;">
            <input type="number" id="setCalMin" placeholder="Min">
            <input type="number" id="setCalMax" placeholder="Max">
        </div>
        <label>Claude API Key (para Scan Menú)</label>
        <input type="password" id="setApiKey" placeholder="sk-ant-...">
        <p style="font-size:11px; color:var(--text-soft);">Tu llave se guarda solo en este dispositivo.</p>
        <div style="margin-top:20px; border-top:1px solid var(--line); padding-top:20px;">
            <button class="btn btn-ghost" id="btnExportData" style="width:100%; margin-bottom:10px;">Exportar mis Datos (Backup)</button>
            <button class="btn btn-ghost" id="btnCloseSettings" style="width:100%;">Cerrar</button>
        </div>
    </div>
</div>

<!-- Modal Picker -->
<div class="overlay" id="pickerModal">
    <div class="modal">
        <h3 id="pickerTitle">Elegir Receta</h3>
        <div id="pickerList" style="max-height:400px; overflow-y:auto; margin-top:15px;"></div>
        <button class="btn btn-ghost" id="btnClosePicker" style="width:100%; margin-top:15px;">Cancelar</button>
    </div>
</div>

<script>
(function(){
    const DB_NAME = "semana_plato_db";
    const DAYS = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
    
    let state = {
        recipes: [],
        plan: {},
        settings: { calMin: 1450, calMax: 1650, apiKey: '' },
        profile: null,
        activeDay: 'lunes',
        activeFilter: 'todas'
    };

    // Inicializar Plan
    DAYS.forEach(d => state.plan[d] = { desayuno:null, comida:null, cena:null, colacion:[] });

    // Persistencia
    function save(){
        localStorage.setItem(DB_NAME + '_recipes', JSON.stringify(state.recipes));
        localStorage.setItem(DB_NAME + '_plan', JSON.stringify(state.plan));
        localStorage.setItem(DB_NAME + '_settings', JSON.stringify(state.settings));
        localStorage.setItem(DB_NAME + '_profile', JSON.stringify(state.profile));
    }

    function load(){
        state.recipes = JSON.parse(localStorage.getItem(DB_NAME + '_recipes')) || [];
        state.plan = JSON.parse(localStorage.getItem(DB_NAME + '_plan')) || state.plan;
        state.settings = JSON.parse(localStorage.getItem(DB_NAME + '_settings')) || state.settings;
        state.profile = JSON.parse(localStorage.getItem(DB_NAME + '_profile'));
        
        if(state.profile) {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('app-root').classList.add('ready');
            document.getElementById('userNameDisplay').textContent = state.profile.name;
            renderAll();
        }
    }

    // --- Renderizado ---

    function renderAll(){
        renderRecipes();
        renderPlan();
        renderSuper();
        renderSettings();
    }

    function renderRecipes(){
        const grid = document.getElementById('recipeGrid');
        const search = document.getElementById('recipeSearch').value.toLowerCase();
        
        let filtered = state.recipes.filter(r => 
            (state.activeFilter === 'todas' || r.type === state.activeFilter) &&
            (r.name.toLowerCase().includes(search))
        );

        grid.innerHTML = filtered.map(r => `
            <div class="rcard" onclick="openRecipeDetail('${r.id}')">
                <div class="body">
                    <div class="name">${r.name}</div>
                    <div class="cal">${r.calories} kcal</div>
                    <div style="font-size:10px; color:var(--text-soft); text-transform:uppercase; margin-top:5px;">
                        <span class="dot dot-${r.type}"></span>${r.type}
                    </div>
                </div>
            </div>
        `).join('');

        const filters = ['todas', 'desayuno', 'comida', 'cena', 'colacion'];
        document.getElementById('chipFilters').innerHTML = filters.map(f => `
            <div class="day-tab ${state.activeFilter === f ? 'active' : ''}" onclick="setFilter('${f}')">
                ${f.charAt(0).toUpperCase() + f.slice(1)}
            </div>
        `).join('');
    }

    window.setFilter = (f) => { state.activeFilter = f; renderRecipes(); };
    document.getElementById('recipeSearch').addEventListener('input', renderRecipes);

    function renderPlan(){
        const tabs = document.getElementById('dayTabs');
        tabs.innerHTML = DAYS.map(d => `
            <div class="day-tab ${state.activeDay === d ? 'active' : ''}" onclick="setDay('${d}')">
                ${d.charAt(0).toUpperCase() + d.slice(0,2)}
            </div>
        `).join('');

        const dayData = state.plan[state.activeDay];
        const slots = ['desayuno', 'comida', 'cena'];
        
        slots.forEach(slot => {
            const recipeId = dayData[slot];
            const recipe = state.recipes.find(r => r.id === recipeId);
            const slotEl = document.getElementById('plan-' + slot);
            slotEl.innerHTML = `
                <div class="label">
                    <span>${slot.toUpperCase()}</span>
                    <span class="copy-day-btn" onclick="copyDayDialog('${slot}')">copiar</span>
                </div>
                ${recipe ? `
                    <div class="meal-item" onclick="openSlotPicker('${slot}')">
                        <div style="font-weight:600;">${recipe.name}</div>
                        <div style="color:var(--mint);">${recipe.calories} kcal</div>
                    </div>
                ` : `
                    <button class="btn-ghost" style="width:100%; font-size:12px; padding:8px;" onclick="openSlotPicker('${slot}')">+ Asignar</button>
                `}
            `;
        });

        // Colaciones (múltiples)
        const colContainer = document.getElementById('plan-colacion');
        colContainer.innerHTML = `
            <div class="label">COLACIONES</div>
            ${dayData.colacion.map((id, idx) => {
                const r = state.recipes.find(rec => rec.id === id);
                return r ? `<div class="meal-item" onclick="removeColacion(${idx})"><span>${r.name}</span><span>${r.calories} kcal ✕</span></div>` : '';
            }).join('')}
            <button class="btn-ghost" style="width:100%; font-size:12px; padding:8px;" onclick="openSlotPicker('colacion')">+ Agregar Colación</button>
        `;

        renderWeeklyTracker();
    }

    window.setDay = (d) => { state.activeDay = d; renderPlan(); };

    function renderWeeklyTracker(){
        const summary = document.getElementById('weeklySummary');
        let totalWeek = 0;
        DAYS.forEach(d => {
            let dayCal = 0;
            const data = state.plan[d];
            if(data.desayuno) dayCal += (state.recipes.find(r=>r.id===data.desayuno)?.calories || 0);
            if(data.comida) dayCal += (state.recipes.find(r=>r.id===data.comida)?.calories || 0);
            if(data.cena) dayCal += (state.recipes.find(r=>r.id===data.cena)?.calories || 0);
            data.colacion.forEach(id => dayCal += (state.recipes.find(r=>r.id===id)?.calories || 0));
            totalWeek += dayCal;
        });
        summary.innerHTML = `<div class="meal-row" style="background:var(--card2); border-color:var(--butter);">
            <div class="label" style="color:var(--butter);">PROMEDIO SEMANAL</div>
            <div style="font-size:24px; font-weight:600;">${Math.round(totalWeek/7)} <span style="font-size:14px; color:var(--text-soft);">kcal / día</span></div>
        </div>`;
    }

    // --- Súper ---
    function renderSuper(){
        const list = document.getElementById('superList');
        const ingredients = {};

        DAYS.forEach(d => {
            const data = state.plan[d];
            const ids = [data.desayuno, data.comida, data.cena, ...data.colacion].filter(Boolean);
            ids.forEach(id => {
                const r = state.recipes.find(rec => rec.id === id);
                if(r && r.ingredients){
                    r.ingredients.split('\n').forEach(i => {
                        const ing = i.trim();
                        if(ing) ingredients[ing] = (ingredients[ing] || 0) + 1;
                    });
                }
            });
        });

        const items = Object.keys(ingredients);
        if(items.length === 0){
            list.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-soft);">No hay ingredientes en tu plan semanal.</div>`;
            return;
        }

        list.innerHTML = `<h3>Lista de Súper</h3><div class="meal-row" style="margin-top:15px;">
            ${items.map(ing => `
                <div class="meal-item" style="justify-content:flex-start; gap:10px;">
                    <input type="checkbox">
                    <span>${ing} <small style="color:var(--butter);">(${ingredients[ing]}x)</small></span>
                </div>
            `).join('')}
        </div>`;
    }

    // --- Lógica de Modales ---

    // Nueva Receta
    document.getElementById('btnNewRecipe').onclick = () => document.getElementById('recipeModal').classList.add('open');
    document.getElementById('btnCancelRecipe').onclick = () => document.getElementById('recipeModal').classList.remove('open');
    
    document.getElementById('btnSaveRecipe').onclick = () => {
        const name = document.getElementById('rformName').value;
        const cal = parseInt(document.getElementById('rformCal').value);
        const type = document.getElementById('rformType').value;
        const ing = document.getElementById('rformIng').value;

        if(!name || !cal) return alert("Nombre y calorías requeridos");

        state.recipes.push({ id: Date.now().toString(), name, calories: cal, type, ingredients: ing });
        save();
        renderAll();
        document.getElementById('recipeModal').classList.remove('open');
    };

    // Picker
    let currentPickingSlot = null;
    window.openSlotPicker = (slot) => {
        currentPickingSlot = slot;
        const pickerModal = document.getElementById('pickerModal');
        const list = document.getElementById('pickerList');
        
        const filtered = state.recipes.filter(r => r.type === (slot === 'colacion' ? 'colacion' : slot));
        
        list.innerHTML = filtered.map(r => `
            <div class="meal-item" style="padding:15px; background:var(--card2); border-radius:10px; margin-bottom:8px;" onclick="selectRecipe('${r.id}')">
                <b>${r.name}</b>
                <span>${r.calories} kcal</span>
            </div>
        `).join('') || '<p>No tienes recetas para esta categoría.</p>';
        
        pickerModal.classList.add('open');
    };

    window.selectRecipe = (id) => {
        if(currentPickingSlot === 'colacion') state.plan[state.activeDay].colacion.push(id);
        else state.plan[state.activeDay][currentPickingSlot] = id;
        save();
        renderPlan();
        document.getElementById('pickerModal').classList.remove('open');
    };

    window.removeColacion = (idx) => {
        state.plan[state.activeDay].colacion.splice(idx, 1);
        save();
        renderPlan();
    };

    document.getElementById('btnClosePicker').onclick = () => document.getElementById('pickerModal').classList.remove('open');

    // --- Scan Menú ---
    const btnScan = document.getElementById('btnTriggerScan');
    const inputScan = document.getElementById('scanInput');
    
    btnScan.onclick = () => inputScan.click();
    inputScan.onchange = async (e) => {
        const file = e.target.files[0];
        if(!file || !state.settings.apiKey) return alert("Necesitas configurar tu API Key en Ajustes.");
        
        const status = document.getElementById('scanStatus');
        status.textContent = "Procesando imagen...";
        
        // Convertir a base64 (simplificado para el ejemplo)
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const base64Image = ev.target.result.split(',')[1];
            analyzeMenu(base64Image);
        };
        reader.readAsDataURL(file);
    };

    async function analyzeMenu(base64) {
        const status = document.getElementById('scanStatus');
        const results = document.getElementById('scanResults');
        status.textContent = "Claude está analizando el menú...";

        try {
            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: {
                    "x-api-key": state.settings.apiKey,
                    "anthropic-version": "2023-06-01",
                    "content-type": "application/json",
                    "dangerouslyAllowBrowser": "true" // Solo para propósitos de demo personal
                },
                body: JSON.stringify({
                    model: "claude-3-5-sonnet-20240620",
                    max_tokens: 1024,
                    messages: [{
                        role: "user",
                        content: [
                            { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
                            { type: "text", text: "Analiza este menú. Identifica platillos saludables y estima sus calorías. Recomienda la mejor opción para alguien que busca salud y déficit calórico. Responde en español." }
                        ]
                    }]
                })
            });

            const data = await response.json();
            results.innerHTML = `<div class="meal-row">${data.content[0].text.replace(/\n/g, '<br>')}</div>`;
            status.textContent = "Análisis completo.";
        } catch (err) {
            status.textContent = "Error al conectar con la IA.";
            console.error(err);
        }
    }

    // --- Ajustes ---
    document.getElementById('btnSettings').onclick = () => {
        document.getElementById('setCalMin').value = state.settings.calMin;
        document.getElementById('setCalMax').value = state.settings.calMax;
        document.getElementById('setApiKey').value = state.settings.apiKey;
        document.getElementById('settingsModal').classList.add('open');
    };

    document.getElementById('btnCloseSettings').onclick = () => {
        state.settings.calMin = parseInt(document.getElementById('setCalMin').value);
        state.settings.calMax = parseInt(document.getElementById('setCalMax').value);
        state.settings.apiKey = document.getElementById('setApiKey').value;
        save();
        renderWeeklyTracker();
        document.getElementById('settingsModal').classList.remove('open');
    };

    // --- Inicio ---
    document.getElementById('btnEnter').onclick = () => {
        const name = document.getElementById('wName').value;
        if(!name) return;
        state.profile = { name };
        save();
        load();
    };

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGZ1bmN0aW9uKGV2ZW50KSB7IH0pOw==');
        });
    }

    load();

    // Tabs logic
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
            if(btn.dataset.tab === 'super') renderSuper();
        };
    });

})();
</script>
</body>
</html>
